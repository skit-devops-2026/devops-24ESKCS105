apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillswapify-backend
  labels:
    app: skillswapify
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillswapify
      component: backend
  template:
    metadata:
      labels:
        app: skillswapify
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/skit-devops-2026/devops-24eskcs105-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: COMMIT_SHA
              value: "latest"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillswapify-frontend
  labels:
    app: skillswapify
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillswapify
      component: frontend
  template:
    metadata:
      labels:
        app: skillswapify
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/skit-devops-2026/devops-24eskcs105-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
