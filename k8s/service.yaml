apiVersion: v1
kind: Service
metadata:
  name: skillswapify-backend
  labels:
    app: skillswapify
    component: backend
spec:
  type: LoadBalancer
  selector:
    app: skillswapify
    component: backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: skillswapify-frontend
  labels:
    app: skillswapify
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: skillswapify
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
